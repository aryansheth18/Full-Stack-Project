services:
  # Backend Web Service
  - type: web
    name: store-rating-backend
    env: node
    plan: free
    buildCommand: npm install && npm --prefix backend install && npm --prefix frontend install && npm run build && npm --prefix backend run prisma:push && npm --prefix backend run seed
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qzYmPZ9WA2uE@ep-broad-cloud-ax9ikf5a.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://store-rating-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: store-rating-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://store-rating-backend.onrender.com/api
